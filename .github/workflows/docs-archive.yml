# Snapshots docs-site/ into docs-site/archive/vX.Y.Z/ whenever a GitHub
# Release is created, so old docs stay browsable after newer releases move
# the "latest" docs on. X.Y.Z is read from setup.py (the source of truth for
# the version being released), not from the release's tag name.
#
# example-report/ is deliberately excluded from the snapshot - it's a large,
# not-version-specific demo, not documentation content - so archived pages
# link back to the one shared copy at docs-site/example-report/ instead.
#
# This workflow pushes to main using the default GITHUB_TOKEN, which does
# NOT trigger other workflows via the push event - so it explicitly
# dispatches pages.yml afterwards rather than relying on that push to do it.
name: Archive docs on release

on:
  release:
    types: [created]

permissions:
  contents: write
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve the version being released
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP "version='\K[^']+" setup.py)
          if [ -z "$version" ]; then
            echo "Could not read a version out of setup.py" >&2
            exit 1
          fi
          echo "Releasing version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Snapshot the current docs
        id: snapshot
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          dest="docs-site/archive/v${version}"

          if [ -d "$dest" ]; then
            echo "$dest already exists, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$dest"
          cp docs-site/*.html "$dest"/
          cp -r docs-site/assets "$dest"/

          # example-report/ isn't part of the snapshot - point archived pages
          # at the current, shared copy instead of a link that would 404.
          sed -i 's#href="example-report/#href="../../example-report/#g' "$dest"/*.html

          # Tell the header version selector (assets/js/main.js) how far up
          # the site root is from here, and which archived version this is -
          # it uses those instead of sniffing the URL, and works identically
          # whether the page is at the site root or in here.
          sed -i "s#<body data-root-prefix=\"\">#<body data-root-prefix=\"../../\" data-archived-version=\"${version}\">#" "$dest"/*.html

          # Keep archived snapshots out of search results; the live docs are
          # the canonical version to index.
          sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, follow">#' "$dest"/*.html

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Update the version list and archive index page
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          archive_dir = pathlib.Path("docs-site/archive")
          versions_path = archive_dir / "versions.json"

          versions = json.loads(versions_path.read_text()) if versions_path.exists() else []
          if version not in versions:
              versions.insert(0, version)
          versions_path.write_text(json.dumps(versions, indent=2) + "\n")

          items = "\n".join(
              f'        <li><a href="v{v}/index.html">v{v}</a></li>' for v in versions
          )
          body = (
              f'    <ul>\n{items}\n    </ul>'
              if versions
              else "    <p><em>No versions are archived yet - this page is "
                   "populated automatically the next time a release is "
                   "published.</em></p>"
          )

          html = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>OceanVal &mdash; Documentation archive</title>
          <meta name="robots" content="noindex, follow">
          <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
          <link rel="stylesheet" href="../assets/css/style.css">
          </head>
          <body data-root-prefix="../">
          <header class="site-header">
            <div class="container nav">
              <div class="brand">
                <a href="../index.html" aria-label="OceanVal home">
                  <img src="../assets/img/oceanval_wordmark.svg" alt="OceanVal">
                </a>
                <select id="oceanval-version-select" class="version-select" aria-label="OceanVal docs version" disabled>
                  <option value="">v&hellip;</option>
                </select>
              </div>
            </div>
          </header>
          <main class="container" style="padding: 60px 0; max-width: 640px;">
            <h1>Documentation archive</h1>
            <p>Snapshots of the OceanVal docs as they stood at each release, so
            you can look up the docs for a version you have installed rather
            than the latest one. For the current docs, see the
            <a href="../index.html">latest version</a>.</p>
          {body}
          </main>
          <script src="../assets/js/main.js"></script>
          </body>
          </html>
          """
          (archive_dir / "index.html").write_text(html)
          PY

      - name: Commit and push the snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-site/archive
          git commit -m "Archive docs for v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Trigger the Pages deploy
        # A GITHUB_TOKEN push doesn't itself trigger pages.yml's push
        # trigger, so ask it to run directly instead.
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
