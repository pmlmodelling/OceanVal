# Simple workflow for deploying the docs-site/ static content to GitHub Pages.
# This is the only Pages workflow in the repo - do not add a second one that
# uploads path: '.', it will race this one and publish the wrong content.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch that touch the site source
  push:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"

  # Allows you to run this workflow manually from the Actions tab, or lets
  # docs-archive.yml trigger it with the version it already resolved from
  # setup.py - skipping the PyPI lookup below, which can otherwise race
  # python-publish.yml's upload and bake in the previous version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bake into the header badge (skips the PyPI lookup). Leave blank to query PyPI for the latest release."
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bake in the version badge
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version=$(curl -sf https://pypi.org/pypi/oceanval/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
            echo "No version passed in, using the latest release on PyPI: $version"
          else
            echo "Using version passed in by the triggering workflow: $version"
          fi
          grep -rl 'v&hellip;' docs-site/*.html | xargs -r sed -i "s/v\&hellip;/v${version}/g"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the site source, not the whole package repo
          path: "docs-site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
