# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Daily build 

defaults:
  run:
    shell: bash -l {0}

on:
  schedule:
  - cron: "09 10 * * *"


jobs:
  build:

    runs-on: "ubuntu-latest" 

    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
      # - uses: mamba-org/provision-with-micromamba@v15
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        with:
          micromamba-version: '1.4.5-0'
          environment-name: foo
          create-args: nctoolkit cmocean python=3.11 rpy2 r-base r-tidyverse r-ggtext jupyter-book>=2 r-mapdata nodejs=22.23.2
          init-shell: >-
            bash
          cache-environment: true
          post-cleanup: 'all'
      - name: Install dependencies
        shell: bash -l {0}
        run: |
        
          mamba install pandoc r-ggthemes r-ggridges r-maps r-plotrix r-arrow r-cowplot -y
          python -m pip install .
          pip install pyarrow
          pip install rioxarray
          pip install pytest
          pip install pytest-cov
          pip install coverage 

      # with jupyter-book 1 the reports are built the old way and the interim
      # report cannot be built at all, so make sure the solver gave us 2
      - name: Check jupyter-book is version 2
        shell: bash -l {0}
        run: |
          python -c "from importlib.metadata import version; v = version('jupyter-book'); print('jupyter-book', v); assert int(v.split('.')[0]) >= 2, f'jupyter-book {v} is installed, the tests need 2'"

      - name: Test with pytest
        shell: bash -l {0}
        run: |
          pytest tests/test*.py
      
